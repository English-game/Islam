<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Learn English Levels</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { touch-action: manipulation; }
    </style>
</head>
<body>
    <div id="app">
        <div id="auth-screen" class="container">
            <h1>Хуш омадед</h1>
            <input type="text" id="username-input" placeholder="Номи худро нависед..." autocomplete="off">
            <button onclick="login()" class="btn-main">Вуруд</button>
        </div>

        <div id="main-menu" class="container hidden">
            <h2 id="welcome-msg"></h2>
            <div class="menu-buttons">
                <button onclick="showLevels()" class="btn-main">Start</button>
                <button onclick="showResults()" class="btn-secondary">Result</button>
            </div>
        </div>

        <div id="level-screen" class="container hidden">
            <h3>Интихоби Левел</h3>
            <div id="levels-grid" class="grid"></div>
            <button onclick="backToMenu()" class="btn-back">Бозгашт</button>
        </div>

        <div id="quiz-screen" class="container hidden">
            <div class="quiz-header">
                <span id="timer">08:00</span>
                <span id="score-counter">Score: 0</span>
            </div>
            <div class="question-box">
                <p>Тарҷума кунед:</p>
                <h2 id="tj-word"></h2>
                <input type="text" id="en-answer" placeholder="Инҷо нависед..." autocomplete="off">
                <button onclick="checkAnswer()" class="btn-main">Next</button>
            </div>
        </div>

        <div id="result-screen" class="container hidden">
            <h3>Натиҷаҳо</h3>
            <div id="stats-content"></div>
            <div class="result-actions">
                <button onclick="toggleMistakes()" id="btn-mistakes" class="btn-secondary hidden">Хатогиҳо</button>
                <button onclick="startQuiz(currentLevel)" class="btn-repeat">🔄 Такрор кардан</button>
                <button onclick="backToMenu()" class="btn-main">Меню</button>
            </div>
            <div id="mistakes-list" class="hidden"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
